services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - apps/api/.env.local
    environment:
      WEB_ORIGIN: http://localhost:8080

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_BASE: http://localhost:3000/api/jobs
    ports:
      - "8080:8080"
    depends_on:
      - api
